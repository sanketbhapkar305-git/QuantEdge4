workflows:
  android-debug-build:
    name: QuantEdge Debug APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Set Gradle permissions
        script: chmod +x gradlew
      - name: Build debug APK
        script: ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - YOUR_EMAIL@gmail.com   # <-- replace with your email
        notify:
          success: true
          failure: true
